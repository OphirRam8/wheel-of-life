<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wheel of Life</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    padding: 24px;
    min-height: 100vh;
  }

  .header {
    text-align: center;
    margin-bottom: 24px;
  }

  h1 {
    font-size: 36px;
    font-weight: 900;
    color: #1a1a1a;
    margin-bottom: 6px;
    letter-spacing: -1px;
    text-transform: uppercase;
    background: linear-gradient(135deg, #FF6B35, #E91E63, #9B59B6, #2196F3, #27AE60);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 15px;
    color: #999;
    font-weight: 500;
  }

  .layout {
    display: flex;
    flex-direction: row-reverse;
    align-items: flex-start;
    justify-content: center;
    gap: 40px;
    max-width: 900px;
    margin: 0 auto;
  }

  .wheel-container {
    position: relative;
    width: 400px;
    height: 400px;
    flex-shrink: 0;
    position: sticky;
    top: 24px;
  }

  canvas {
    width: 400px;
    height: 400px;
  }

  .center-score {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 44px;
    height: 44px;
    background: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 16px;
    color: #1a1a1a;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    z-index: 10;
  }

  .sliders {
    flex: 1;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .slider-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .slider-label {
    font-size: 16px;
    font-weight: 700;
    color: #1a1a1a;
  }

  .slider-row {
    position: relative;
    height: 36px;
    touch-action: none;
    cursor: pointer;
  }

  .slider-track {
    width: 100%;
    height: 36px;
    background: #e8e8e8;
    border-radius: 18px;
    position: relative;
    overflow: visible;
  }

  .slider-fill {
    height: 100%;
    border-radius: 18px;
    position: relative;
  }

  .slider-thumb {
    position: absolute;
    right: -16px;
    top: 50%;
    transform: translateY(-50%);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    box-shadow: 0 1px 6px rgba(0,0,0,0.25);
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .slider-value {
    font-size: 11px;
    font-weight: 800;
    color: #fff;
    user-select: none;
    pointer-events: none;
  }

  /* Mobile: stack vertically, wheel on top */
  @media (max-width: 820px) {
    .layout {
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .wheel-container {
      position: static;
      width: 300px;
      height: 300px;
    }

    canvas {
      width: 300px;
      height: 300px;
    }

    .sliders {
      max-width: 100%;
      width: 100%;
    }

    body { padding: 16px; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>Wheel of Life</h1>
  <p class="subtitle">Rate each area of your life from 0 to 100</p>
</div>

<div class="layout">
  <div class="wheel-container">
    <canvas id="wheel" width="800" height="800"></canvas>
    <div class="center-score" id="centerScore">0</div>
  </div>

  <div class="sliders" id="sliders"></div>
</div>

<script>
const categories = [
  { name: "Physical Body",          color: "#FF6B35" },
  { name: "Emotions & Meaning",     color: "#9B59B6" },
  { name: "Relationships",          color: "#E91E63" },
  { name: "Time",                   color: "#2196F3" },
  { name: "Work / Career / Mission",color: "#F5A623" },
  { name: "Finances",               color: "#27AE60" },
  { name: "Celebrate & Contribute", color: "#00BFA5" },
  { name: "Personal Growth",        color: "#FF5252" },
];

const values = categories.map(() => 50);

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
const cx = W / 2;
const cy = H / 2;
const maxR = W / 2 - 40;

function drawWheel() {
  ctx.clearRect(0, 0, W, H);
  const n = categories.length;
  const angleStep = (2 * Math.PI) / n;
  const startOffset = -Math.PI / 2;

  // Draw outer circle
  ctx.beginPath();
  ctx.arc(cx, cy, maxR, 0, 2 * Math.PI);
  ctx.strokeStyle = '#e0e0e0';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Draw grid circles
  for (let i = 1; i <= 4; i++) {
    ctx.beginPath();
    ctx.arc(cx, cy, (maxR * i) / 4, 0, 2 * Math.PI);
    ctx.strokeStyle = '#f0f0f0';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Draw segment lines and "100" labels
  for (let i = 0; i < n; i++) {
    const angle = startOffset + i * angleStep;
    const x = cx + Math.cos(angle) * maxR;
    const y = cy + Math.sin(angle) * maxR;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x, y);
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 2;
    ctx.stroke();

    const labelR = maxR + 22;
    const lx = cx + Math.cos(angle) * labelR;
    const ly = cy + Math.sin(angle) * labelR;
    ctx.save();
    ctx.translate(lx, ly);
    ctx.rotate(angle + Math.PI / 2);
    ctx.font = 'bold 18px -apple-system, sans-serif';
    ctx.fillStyle = '#999';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('100', 0, 0);
    ctx.restore();
  }

  // Draw filled segments
  for (let i = 0; i < n; i++) {
    const angle1 = startOffset + i * angleStep;
    const angle2 = startOffset + (i + 1) * angleStep;
    const r = (values[i] / 100) * maxR;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, angle1, angle2);
    ctx.closePath();
    ctx.fillStyle = categories[i].color;
    ctx.fill();
  }

  // Redraw segment lines on top (white)
  for (let i = 0; i < n; i++) {
    const angle = startOffset + i * angleStep;
    const x = cx + Math.cos(angle) * maxR;
    const y = cy + Math.sin(angle) * maxR;

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x, y);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // Center white circle
  ctx.beginPath();
  ctx.arc(cx, cy, 26, 0, 2 * Math.PI);
  ctx.fillStyle = '#fff';
  ctx.fill();

  // Update center score
  const avg = Math.round(values.reduce((a, b) => a + b, 0) / n);
  document.getElementById('centerScore').textContent = avg;
}

function updateSlider(index, val, fill, valueLabel) {
  val = Math.max(0, Math.min(100, Math.round(val / 5) * 5));
  values[index] = val;
  fill.style.width = Math.max(val, 10) + '%';
  valueLabel.textContent = val;
  drawWheel();
  saveState();
}

function getPointerX(e) {
  if (e.touches && e.touches.length > 0) return e.touches[0].clientX;
  return e.clientX;
}

function createSliders() {
  const container = document.getElementById('sliders');
  categories.forEach((cat, i) => {
    const group = document.createElement('div');
    group.className = 'slider-group';

    const label = document.createElement('div');
    label.className = 'slider-label';
    label.textContent = cat.name;

    const row = document.createElement('div');
    row.className = 'slider-row';

    const track = document.createElement('div');
    track.className = 'slider-track';

    const fill = document.createElement('div');
    fill.className = 'slider-fill';
    fill.style.background = cat.color;
    fill.style.width = Math.max(values[i], 10) + '%';

    const valueLabel = document.createElement('span');
    valueLabel.className = 'slider-value';
    valueLabel.textContent = values[i];

    const thumb = document.createElement('div');
    thumb.className = 'slider-thumb';

    thumb.style.background = cat.color;
    thumb.appendChild(valueLabel);
    fill.appendChild(thumb);
    track.appendChild(fill);
    row.appendChild(track);

    // Touch and mouse handling directly on the row
    let dragging = false;

    function calcValue(clientX) {
      const rect = track.getBoundingClientRect();
      const x = clientX - rect.left;
      return (x / rect.width) * 100;
    }

    function onStart(e) {
      e.preventDefault();
      dragging = true;
      const val = calcValue(getPointerX(e));
      updateSlider(i, val, fill, valueLabel);
    }

    function onMove(e) {
      if (!dragging) return;
      e.preventDefault();
      const val = calcValue(getPointerX(e));
      updateSlider(i, val, fill, valueLabel);
    }

    function onEnd() {
      dragging = false;
    }

    row.addEventListener('mousedown', onStart);
    row.addEventListener('touchstart', onStart, { passive: false });
    document.addEventListener('mousemove', onMove);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchend', onEnd);

    group.appendChild(label);
    group.appendChild(row);
    container.appendChild(group);
  });
}

function saveState() {
  try {
    localStorage.setItem('wheelOfLife', JSON.stringify(values));
  } catch (e) {}
}

function loadState() {
  try {
    const saved = localStorage.getItem('wheelOfLife');
    if (saved) {
      const parsed = JSON.parse(saved);
      parsed.forEach((v, i) => { if (i < values.length) values[i] = v; });
    }
  } catch (e) {}
}

loadState();
createSliders();
drawWheel();
</script>
</body>
</html>
